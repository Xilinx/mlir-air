name: Agentic harness host checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy ml_dtypes pyyaml
      - name: Check canonical payload and client registrations
        run: python agentic/tools/sync_package.py --check
      - name: Task, evidence and production capture contracts
        run: python -m unittest discover -s agentic/tests -v
      - name: Shared deployment host regressions
        # The shared affine-Q4 deployment code is Linux-only (os.pread).
        if: runner.os == 'Linux'
        run: python python/test/api/llms_affine_q4.py .
