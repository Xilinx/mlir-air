name: Generate Github Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docs:
    name: Generate Documentation
    runs-on: ubuntu-22.04

    # contents: write for the mike/Pages deployment (pushes to gh-pages);
    # actions: read to download the latest nightly LLM perf artifact.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Configure Environment
        run: echo "$GITHUB_WORKSPACE/llvm/install/bin" >> $GITHUB_PATH

      # mike needs the full gh-pages history to update versions.json, so fetch
      # all history (not a shallow clone).
      - name: Get repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      - name: Install Ninja
        uses: llvm/actions/install-ninja@55d844821959226fab4911f96f37071c1d4c3268

      - name: Get Submodule Hash
        id: get-submodule-hash
        run: echo "::set-output name=hash::$(md5sum $(echo utils/clone-mlir-aie.sh))"
        shell: bash

      - name: Ccache for C++ compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-generatedocs-${{ steps.get-submodule-hash.outputs.hash }}
          max-size: 1G

      - name: Build and Install libxaie
        run: utils/github-clone-build-libxaie.sh

      - name: Get mlir-aie
        run: utils/clone-mlir-aie.sh

      - name: Build and install mlir-aie
        id: build-aie
        run: |
          pushd mlir-aie
          pip install -r python/requirements.txt
          pip install -r python/requirements_ml.txt
          pip install -r python/requirements_dev.txt

          LLVM_VERSION=$(utils/clone-llvm.sh --get-wheel-version)
          echo "LLVM_PROJECT_VERSION=${LLVM_VERSION}" | tee -a $GITHUB_OUTPUT

          pip -q download mlir==$LLVM_VERSION \
            -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro
          unzip -q mlir-*.whl
          find mlir -exec touch -a -m -t 201108231405.14 {} \;

          MLIR_AIE_VERSION=`git rev-parse HEAD`
          echo "MLIR_AIE_COMMIT=${MLIR_AIE_VERSION}" | tee -a $GITHUB_OUTPUT

          popd

          utils/github-build-mlir-aie.sh

      # Generate the tblgen dialect/pass reference pages (AIRDialect.md,
      # AIRRtDialect.md, AIRConversionPasses.md, AIRTransformPasses.md,
      # AIRTransformOps.md) via `make docs`, then copy them into the MkDocs
      # docs tree so the "MLIR Reference" nav entries resolve.
      - name: Build dialect/pass reference docs
        run: |
          mkdir build_release
          pushd build_release
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DCMAKE_MODULE_PATH=`pwd`/../mlir-aie/cmake/modulesXilinx \
            -DMLIR_DIR=`pwd`/../mlir-aie/mlir/lib/cmake/mlir/ \
            -DLLVM_DIR=`pwd`/../mlir-aie/mlir/lib/cmake/llvm/ \
            -DAIE_DIR=`pwd`/../mlir-aie/install/lib/cmake/aie/ \
            -DCMAKE_LINKER=lld \
            -DLLVM_EXTERNAL_LIT=`pwd`/../llvm/build/bin/llvm-lit \
            -DAIR_BUILD_RUNTIME=OFF
          make docs
          popd
          cp build_release/docs/*.md docs/ 2>/dev/null || true
          # These pages are referenced by the "MLIR Reference" nav in mkdocs.yml;
          # fail loudly here rather than letting mike deploy a site with broken
          # nav entries that are harder to diagnose later.
          missing=""
          for f in AIRDialect AIRRtDialect AIRConversionPasses AIRTransformPasses AIRTransformOps; do
            test -f "docs/$f.md" || missing="$missing $f.md"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: tblgen reference docs not generated:$missing" >&2
            exit 1
          fi

      # Pull perf.json from the most recent nightly LLM benchmark that produced
      # an artifact so generate_readme.py can render the LLM benchmark table. We
      # intentionally do NOT filter on run conclusion: a run where a model failed
      # verify still uploads a perf.json (if:always), and that partial/failed
      # state is exactly what we want on the dashboard. Best-effort.
      - name: Fetch latest nightly LLM perf
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --branch main, and skip an empty perf.json: it renders a table with
          # no rows instead of falling through to the last good run, which is
          # how the page went blank (a branch's suite-narrowed dispatch uploaded
          # a 0-model perf.json and every later push to main rebuilt from it).
          for RID in $(gh run list --repo ${{ github.repository }} \
              --workflow nightlyPerfBenchmark.yml --branch main -L 8 \
              --json databaseId --jq '.[].databaseId'); do
            echo "Trying perf artifact from nightly run $RID..."
            rm -rf /tmp/llmperf
            gh run download "$RID" --repo ${{ github.repository }} \
              --name "perf-$RID" --dir /tmp/llmperf 2>/dev/null || true
            if [ -f /tmp/llmperf/perf.json ]; then
              n=$(python3 -c "import json,sys;print(len(json.load(open('/tmp/llmperf/perf.json'))))" 2>/dev/null || echo 0)
              if [ "$n" -gt 0 ]; then
                echo "Using perf.json from run $RID ($n models)"
                break
              fi
              echo "  run $RID has an empty perf.json; skipping"
              rm -rf /tmp/llmperf
            fi
          done
          test -f /tmp/llmperf/perf.json \
            && echo "perf.json fetched" \
            || echo "no nightly perf artifact with perf.json available"
          # sweep.json rides in the same artifact but is younger than perf.json,
          # so an older nightly may have one and not the other. Its absence just
          # drops the tok/s-vs-context table; the rest of the page still builds.
          test -f /tmp/llmperf/sweep.json \
            && echo "sweep.json fetched" \
            || echo "no sweep.json in that artifact; context table omitted"

      # Pull the append-only time series from the durable `perf-history` branch
      # (accumulated by nightlyPerfBenchmark.yml). Best-effort: if the branch
      # doesn't exist yet, no history is fetched and the generator emits an
      # empty-state page.
      - name: Fetch perf history
        continue-on-error: true
        run: |
          mkdir -p /tmp/llmperf_history
          if git fetch --depth 1 origin perf-history 2>/dev/null; then
            git show FETCH_HEAD:history.ndjson > /tmp/llmperf_history/history.ndjson \
              && echo "history.ndjson fetched" \
              || echo "perf-history branch has no history.ndjson; empty-state page"
          else
            echo "no perf-history branch yet; empty-state page"
          fi

      # Generate the CI-produced MkDocs pages into the docs tree:
      #   - Operator Dashboard (operators only)
      #   - LLMs on NPU overview (live nightly benchmark table)
      #   - LLM Performance History (charts, embedded for Material)
      - name: Generate dashboard pages
        run: |
          BASE=https://github.com/Xilinx/mlir-air/tree/main/programming_examples/
          mkdir -p docs/programming_examples docs/llms
          python3 programming_examples/generate_readme.py \
            --section operators --base-url "$BASE" \
            --output docs/programming_examples/index.md
          python3 programming_examples/generate_readme.py \
            --section llm --base-url "$BASE" \
            --llm-perf /tmp/llmperf/perf.json \
            --llm-sweep /tmp/llmperf/sweep.json \
            --output docs/llms/index.md
          python3 programming_examples/generate_perf_history.py \
            --embed --history /tmp/llmperf_history/history.ndjson \
            --output docs/llms/perf-history.md

      - name: Save build info
        run: |
          LLVM_VER="${{ steps.build-aie.outputs.LLVM_PROJECT_VERSION }}"
          AIE_VER="${{ steps.build-aie.outputs.MLIR_AIE_COMMIT }}"
          printf '{\n  "llvm-version": "%s",\n  "mlir-aie-version": "%s"\n}\n' \
            "$LLVM_VER" "$AIE_VER" > docs/build_info.json

      - name: Install MkDocs
        run: pip install -r docs/requirements-mkdocs.txt

      # Deploy the versioned MkDocs site to gh-pages with mike. Pre-release there
      # is a single "dev" version, set as the default so the site root resolves
      # to it. When AIR cuts a release, add a numbered version aliased "latest".
      - name: Deploy with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push dev
          mike set-default --push dev
