# Temporary: free regenerable caches on the nightly LLM runner. Not for main.
name: Runner disk cleanup

on:
  push:
    branches: [ci/runner-disk-probe]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: amdryzenai5pro340
    timeout-minutes: 30
    env:
      MODE: dry-run
    steps:
      # No checkout: it would git-clean the shared nightly workspace.
      - name: Clean derived caches of the examples #2206 moved off the runner
        shell: bash {0}
        run: |
          set -u +e +o pipefail
          df -h "$HOME" | tail -1
          total=0
          # Each is read only by its own example: dflash/{qwen3_8b,llama31_8b},
          # qwen3_8b_q4nx, qwen25_7b_q4nx -- none of which the nightly runs now.
          for d in "$HOME/.cache/mlir-air/dflash/qwen3_8b" "$HOME/.cache/mlir-air/dflash/llama31_8b" \
                   "$HOME/.cache/q4nx_qwen3_8b" "$HOME/.cache/q4nx_qwen25_7b"; do
            [ -e "$d" ] || { echo "absent    $d"; continue; }
            kb=$(du -sk "$d" | cut -f1); total=$((total + kb))
            printf '%8.1fG  %s  (newest atime %s)\n' "$(echo "$kb/1048576" | bc -l)" "$d" \
              "$(find "$d" -type f -printf '%AY-%Am-%Ad\n' | sort | tail -1)"
            [ "$MODE" = delete ] && rm -rf -- "$d"
          done
          printf 'TOTAL %s: %.1fG\n' "$MODE" "$(echo "$total/1048576" | bc -l)"
          echo "kept:"; du -sh "$HOME"/.cache/mlir-air/dflash/* "$HOME"/.cache/q4nx* 2>/dev/null
          df -h "$HOME" | tail -1
